<div class="main-body">
  <mat-form-field
    appearance="outline"
    subscriptSizing="dynamic"
    style="width: 100%; max-width: 220px; height: 10px"
  >
    <mat-label>Filter Users</mat-label>
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Ex. Mia"
      #input
    />
    <mat-icon matSuffix style="color: #888">search</mat-icon>
  </mat-form-field>

  <div class="table-container">
    <table mat-table matSort [dataSource]="myDataSource()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td
          mat-cell
          *matCellDef="let row"
          [appHighlightSearch]="searchText"
          [originalText]="row.name | titleCase"
        >
          {{ row.name | titleCase }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td
          mat-cell
          *matCellDef="let row"
          [appHighlightSearch]="searchText"
          [originalText]="row.email"
        >
          {{ row.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="gender">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Gender</th>
        <td
          mat-cell
          *matCellDef="let row"
          [appHighlightSearch]="searchText"
          [originalText]="row.gender"
        >
          {{ row.gender }}
        </td>
      </ng-container>

      <ng-container matColumnDef="jobTitle">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Job Title</th>
        <td
          mat-cell
          *matCellDef="let row"
          [appHighlightSearch]="searchText"
          [originalText]="row.jobTitle"
        >
          {{ row.jobTitle }}
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Action</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="onEditClick(row)" color="primary">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="onDeleteUser(row.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">
          No data matching the filter "{{ input.value }}"
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="100"
      [pageSize]="3"
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of users"
    ></mat-paginator>
  </div>
</div>
