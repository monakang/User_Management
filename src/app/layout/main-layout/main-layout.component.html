<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened>
    <mat-toolbar color="primary" class="sidenav-header">
      <span>User Application</span>
    </mat-toolbar>
    <!-- <div style="padding: 20px; font-weight: bold">User Application</div> -->
    <mat-divider></mat-divider>
    <mat-nav-list>
      <a mat-list-item [routerLink]="['/user']">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <!-- <a mat-list-item [routerLink]="['/userdetails']">
        <mat-icon matListItemIcon>list_alt</mat-icon>
        <span matListItemTitle>User Details</span>
      </a> -->
      <a mat-list-item [routerLink]="['/search']">
        <mat-icon matListItemIcon>search</mat-icon>
        <span matListItemTitle>Search</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <!-- <mat-toolbar color="primary" class="top-toolbar">
      <span>User Portal</span>
      <span class="toolbar-spacer"></span>
      <button mat-icon-button [matMenuTriggerFor]="profileMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar> -->

    <mat-toolbar color="primary" class="top-toolbar">
      <!-- <span>User App</span> -->

      <span class="toolbar-spacer"></span>

      <button
        mat-icon-button
        [matMenuTriggerFor]="profileMenu"
        aria-label="User profile menu"
      >
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #profileMenu="matMenu" xPosition="before">
        <button mat-menu-item disabled>
          <mat-icon>person</mat-icon>
          <span>Logged in as: {{ username }}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Log Out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div style="padding: 24px">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
